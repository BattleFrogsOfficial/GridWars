<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GridWars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="top"></div>
  <canvas id="mini" width="500" height="500"></canvas>
  <div id="side">
    <button id="bBuild" title="Build (B)">🔨 Build</button>
    <button id="bBox" title="Drag to select several units">⬚ Select</button>
    <button id="bHome" title="Jump to your Town Hall (H)">🏠</button>
    <button id="bHelp" title="Help">?</button>
  </div>
  <div id="toasts"></div>
  <div id="panel"></div>
</div>

<div id="menu" class="screen">
  <div class="card">
    <h1>GRID<span>WARS</span></h1>
    <p class="tag">Build a village. Raise an army. Be the last one standing.</p>
    <label>Your name <input id="iName" maxlength="16" value="Player"></label>
    <fieldset><legend>Single player</legend>
      <label>Opponents <select id="iAI"><option>1</option><option>2</option><option selected>3</option></select></label>
      <label>Difficulty <select id="iDiff"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
      <label>World seed <input id="iSeed" placeholder="random" inputmode="numeric"></label>
      <button id="bSingle" class="big">Play</button>
    </fieldset>
    <fieldset><legend>Multiplayer (2–4 players)</legend>
      <button id="bHost" class="big">Host a game</button>
      <div class="row"><input id="iCode" placeholder="ROOM CODE" maxlength="5"><button id="bJoin">Join</button></div>
    </fieldset>
    <button id="bHelp2">How to play</button>
    <p id="menuErr" class="err"></p>
  </div>
</div>

<div id="lobby" class="screen hidden"><div class="card">
  <h2>Lobby</h2>
  <p>Room code: <b id="lCode">…</b></p>
  <ul id="lPlayers"></ul>
  <div id="lHost">
    <label>Computer players <select id="lAI"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
    <label>Difficulty <select id="lDiff"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
    <button id="lStart" class="big">Start game</button>
  </div>
  <p id="lWait">Waiting for the host to start…</p>
  <p id="lErr" class="err"></p>
  <button id="lBack">Back</button>
</div></div>

<div id="help" class="screen hidden"><div class="card wide">
  <h2>How to play</h2>
  <div id="helpBody"></div>
  <button id="helpClose" class="big">Close</button>
</div></div>

<div id="end" class="screen hidden"><div class="card">
  <h1 id="endTitle"></h1><p id="endText"></p>
  <button id="endWatch">Keep watching</button> <button id="endMenu" class="big">Main menu</button>
</div></div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/sprites.js"></script>
<script src="js/net.js"></script>
<script src="js/client.js"></script>
</body>
</html>
