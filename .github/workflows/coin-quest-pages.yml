# Publishes the Coin Quest app (the coin-quest folder) to GitHub Pages so it can be installed
# from its own https:// address ("Add to Home Screen") and work offline.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Coin Quest site

# Manual only for now: the app is still being built. To publish automatically on every change to main,
# add back:  push: { branches: [main], paths: ['coin-quest/**'] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coin-quest-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: npm test
        working-directory: coin-quest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coin-quest
      - id: deployment
        uses: actions/deploy-pages@v4
